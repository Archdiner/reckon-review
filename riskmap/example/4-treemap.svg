<text x="28" y="642" class="sub">Shading uses five quantile bins of this repository's own values, so adjacent areas step visibly instead of washing together.</text>
<text x="28" y="660" class="sub">1 translation and fixture areas excluded as high-churn, low-mechanism. Areas too small to label are folded into one cell rather than drawn as slivers.</text>
<text x="28" y="678" class="sub">Read the shading from the strip above, not from a remembered rule — the scale inverts between light and dark themes so that the least explained areas always carry the strongest contrast.</text>
